name: Day-Trading Bot Scanner

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Hit Vercel Serverless Endpoint
        env:
          VERCEL_URL: ${{ secrets.VERCEL_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -X GET "https://$VERCEL_URL/api/bot" \
            -H "Authorization: Bearer $CRON_SECRET"